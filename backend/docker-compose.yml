# 仅启动 Nacos，供本机 Maven / IDE 联调（业务进程在宿主机跑）。
# 整栈 Docker 部署请使用仓库根目录：docker compose up -d --build
services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: yl-nacos
    hostname: nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
